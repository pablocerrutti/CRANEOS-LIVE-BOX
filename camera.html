<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10151d"><title>CRANEOS LIVE BOX · Cámara iPhone</title><link rel="stylesheet" href="web/studio.css"></head><body><div class="app-shell"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">CL</span><span><strong>CRANEOS</strong><small>CÁMARA INALÁMBRICA</small></span></a><span class="status-chip" id="camState">ESPERANDO</span></header><main class="control-view"><section class="panel control-main"><h1>Cámara inalámbrica · iPhone</h1><p>Dejá esta página abierta en el iPhone. El video se enviará a la consola de la laptop por WebRTC.</p><button id="startCamera" class="button primary full">ACTIVAR CÁMARA</button><video id="localVideo" autoplay muted playsinline style="width:100%;max-height:42vh;background:#05080d;border-radius:8px;margin-top:12px"></video><label class="field-label" for="offer">1 · Oferta para la laptop</label><textarea id="offer" rows="5" readonly placeholder="Activá la cámara para generar el código"></textarea><button id="copyOffer" class="button full">COPIAR OFERTA</button><label class="field-label" for="answer">2 · Pegá la respuesta de la laptop</label><textarea id="answer" rows="5" placeholder="Pegá aquí la respuesta"></textarea><button id="connect" class="button take full">CONECTAR CON LA CONSOLA</button><p class="notice">iPhone y laptop en la misma Wi-Fi. No cierres esta página durante la transmisión.</p><a href="./" class="button full">VOLVER A LA CONSOLA</a></section></main></div><script>
(()=>{const $=id=>document.getElementById(id);let pc,stream;const waitIce=p=>new Promise(resolve=>{if(p.iceGatheringState==="complete")return resolve();const t=setTimeout(resolve,8000);p.addEventListener("icegatheringstatechange",()=>{if(p.iceGatheringState==="complete"){clearTimeout(t);resolve();}});});$("startCamera").onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:true});$("localVideo").srcObject=stream;pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});stream.getTracks().forEach(t=>pc.addTrack(t,stream));await pc.setLocalDescription(await pc.createOffer());await waitIce(pc);$("offer").value=JSON.stringify(pc.localDescription);$("camState").textContent="CÁMARA ACTIVA";}catch(e){alert("No se pudo activar la cámara: "+e.message);}};$("copyOffer").onclick=async()=>{try{await navigator.clipboard.writeText($("offer").value);}catch(e){$("offer").select();document.execCommand("copy");}};$("connect").onclick=async()=>{try{if(!pc)throw Error("Primero activá la cámara.");await pc.setRemoteDescription(JSON.parse($("answer").value.trim()));$("camState").textContent="CONECTANDO";pc.onconnectionstatechange=()=>{$("camState").textContent=pc.connectionState.toUpperCase();};}catch(e){alert("No se pudo conectar: "+e.message);}};})();
</script></body></html>
