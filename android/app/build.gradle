plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.craneos.livebox'
    compileSdk 35

    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n\n    kotlinOptions { jvmTarget = '17' }\n\n    defaultConfig {
        applicationId 'com.craneos.livebox'
        minSdk 26
        targetSdk 32
        versionCode 2
        versionName '0.2.0'
    }
}

dependencies {
    // RootEncoder: screen capture (MediaProjection), H.264/AAC and RTMP/RTMPS.
    implementation 'com.github.pedroSG94.RootEncoder:library:2.8.1'
}
